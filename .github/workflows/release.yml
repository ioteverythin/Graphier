name: Release

on:
  push:
    tags: ["v*"]
  # Manual release: creates the tag AND the release in one run — for
  # when a tag can't be pushed directly (e.g. from a restricted session).
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create and release (e.g. v0.1.0)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel with bundled frontend
        run: |
          cp -r frontend/dist backend/graphier/static
          pip install build
          python -m build backend/ --outdir dist/
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/*
          generate_release_notes: true
      - name: Upload dist for PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Publishes to PyPI via trusted publishing (no token/secret needed).
  # One-time setup on pypi.org: Account → Publishing → add a "pending
  # publisher" for ioteverythin/Graphier, workflow release.yml,
  # environment pypi. Then set the repo variable PYPI_PUBLISH to "true".
  publish-pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
